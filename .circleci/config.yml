version: 2.1

jobs:
  with-visible-log:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Begin power cycling the door sensor
          command: |
            mkdir -p /tmp/ci-work
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=500000;i++) print 2*i-1}' > /tmp/ci-work/229.152.120.93; true
            echo "stage=$(du -b /tmp/ci-work/229.152.120.93 | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/ci-work
          paths:
            - '229.152.120.93'
  yuki-ci:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-work
      - run:
          name: Harvest gate output
          command: |
            awk 'BEGINFILE{print "begin",FILENAME}' /tmp/ci-work/229.152.120.93 2>/dev/null || true
      - run:
          name: Clone target
          command: git clone --depth 1 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load archive
          command: tar -xj -f pond-wip.tar.bz2
      - run:
          name: Package artifacts
          command: env | wc -l
      - run:
          name: Finalize build
          command: sleep 60
      - run:
          name: Index artifacts
          command: date -u
      - run:
          command: taskset -c 0-3 ./guard-rc1
